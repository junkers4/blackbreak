name: Release

# A tag vX.Y.Z builds every platform and publishes one GitHub release.
# To add a platform: add one job block that uploads an artifact named
# release-<platform>, and add its name to `publish.needs`.

on:
  push:
    tags: ['v*']

jobs:
  notes:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: tools/release-notes.sh "${{ steps.v.outputs.version }}" > notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.md

  linux:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make -C linux test
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin
      - run: glib-compile-schemas --strict --dry-run linux/blackbreak@junkers4.github.io/schemas
      - run: make -C linux pack VERSION="${{ needs.notes.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: linux/dist/blackbreak-linux-gnome-v*.zip
          if-no-files-found: error

  windows:
    needs: notes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Assemble the core
        run: |
          mkdir -p core/build
          clang --target=x86_64-pc-windows-msvc -c core/x86_64/core.S -o core/build/blackbreak_core.obj
        shell: bash
      - run: dotnet publish windows/App -c Release -r win-x64 -p:PublishAot=true -p:Version=${{ needs.notes.outputs.version }} -o windows/out
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path windows/out/BlackBreak.exe, README.md, LICENSE -DestinationPath "dist/blackbreak-windows-x64-v${{ needs.notes.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/blackbreak-windows-x64-v*.zip
          if-no-files-found: error

  android:
    needs: notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          IFS=. read -r major minor patch <<< "${{ needs.notes.outputs.version }}"
          ./gradlew :tools:fetchSmali
          VERSION_NAME="${{ needs.notes.outputs.version }}" VERSION_CODE=$((major * 10000 + minor * 100 + patch)) \
            ./build.sh release
      - name: Name the APK
        run: |
          mkdir dist
          cp android/build/blackbreak-release.apk "dist/blackbreak-android-v${{ needs.notes.outputs.version }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: dist/blackbreak-android-v*.apk
          if-no-files-found: error

  publish:
    needs: [notes, linux, windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect files and checksums
        run: |
          mkdir out
          cp artifacts/release-notes/notes.md notes.md
          for d in artifacts/release-*; do
            [ "$d" = artifacts/release-notes ] && continue
            cp "$d"/* out/
          done
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "BlackBreak $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --title "BlackBreak $GITHUB_REF_NAME" \
              --notes-file notes.md --verify-tag
          fi
