name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: make -C linux test

  gnome-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin
      - run: glib-compile-schemas --strict --dry-run linux/blackbreak@junkers4.github.io/schemas
      - run: make -C linux pack
      - uses: actions/upload-artifact@v4
        with:
          name: blackbreak-gnome
          path: linux/dist/*.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test windows/Core.Tests
      - run: dotnet publish windows/App -c Release -r win-x64 -p:PublishAot=true -p:Version=0.0.0 -o windows/out
      - name: Size
        shell: pwsh
        run: |
          $size = (Get-Item windows/out/BlackBreak.exe).Length
          "BlackBreak.exe is $size bytes"
          if ($size -gt 15MB) { throw "exe larger than 15 MB" }
      - name: Smoke
        shell: pwsh
        env:
          BLACKBREAK_DEBUG_FAST: "1"
        run: |
          $p = Start-Process -FilePath windows/out/BlackBreak.exe -ArgumentList '--smoke','45','smoke.log' -PassThru -Wait
          Get-Content smoke.log
          $want = 'phase warning','phase break','desktop switched','desktop restored','phase work'
          $got = Get-Content smoke.log
          $i = 0
          foreach ($line in $got) { if ($i -lt $want.Count -and $line -eq $want[$i]) { $i++ } }
          if ($i -lt $want.Count) { throw "smoke log lacks '$($want[$i])' in order" }
      - name: Screenshot of the break
        shell: pwsh
        run: |
          $p = Start-Process windows/out/BlackBreak.exe -ArgumentList '--test-preview','12' -PassThru
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
          $bmp.Save("$PWD/break-windows.png")
          $p | Wait-Process -Timeout 20 -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: break-windows-screenshot
          path: break-windows.png
      - name: Kill and fail-safe
        shell: pwsh
        run: ./windows/test/resilience.ps1 windows/out/BlackBreak.exe
      - uses: actions/upload-artifact@v4
        with:
          name: blackbreak-windows
          path: windows/out/BlackBreak.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
      - name: Size
        run: |
          size=$(stat -c %s android/app/build/outputs/apk/debug/app-debug.apk)
          echo "app-debug.apk is $size bytes"
          [ "$size" -lt 1048576 ]
      - uses: actions/upload-artifact@v4
        with:
          name: blackbreak-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
